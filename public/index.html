<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Security Header Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>HTTP Security Header Analyzer</h1>
        <p class="subtitle">Analyze the security headers of a website</p>
        <div class="scanner-box">
            <input type="text" id="url" placeholder="Enter website URL:">
            <button id="scanBtn">
                Scan Website
            </button>
        </div>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
